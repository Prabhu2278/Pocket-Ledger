<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ledger – Web App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1b2433;--mute:#5b6577;--line:#e3e8ef;--acc:#4f46e5;--soft:#e8e7fd;--out:#b42c45;--warn:#b45309;--onacc:#fff;--side:#141a2b;--sideink:#c9d1e3;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0d1118;--card:#171d29;--ink:#eef1f6;--mute:#a3adbd;--line:#262f3f;--acc:#8b87ff;--soft:#262a52;--out:#ff7a8a;--warn:#fbbf24;--onacc:#10141c;--side:#0a0e15}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sideink);padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em;padding:0 8px}
.side nav{display:grid;gap:4px}
.side a{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:44px;border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.side a:hover{background:rgba(255,255,255,.08)}
.side a[aria-current=page]{background:#fff;color:#141a2b}
.month{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:12px;padding:2px}
.month button{border:0;background:none;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px}
.month button:hover{background:rgba(255,255,255,.12)}.month span{font-weight:600;color:#fff}
.sidebud{margin-top:auto;padding:14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px}
.sidebud b{display:block;color:#fff;font-size:16px;margin:2px 0 8px}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.meter i{display:block;height:100%;background:#a5a1ff;border-radius:99px;transition:width .5s}
main{padding:24px 28px 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=date],input[type=search],select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.actions input{width:260px}
.primary{border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:800;min-height:44px;padding:0 18px;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card h2{font-size:15px;font-weight:800;margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
.card h2 small{font-weight:400;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi span{color:var(--mute);font-size:13px}.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--acc);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:0 8px 6px}
th button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:6px 0;min-height:36px}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--bg)}
.r{text-align:right}.neg{color:var(--out);font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.rowbtn{border:0;background:none;color:var(--mute);min-width:44px;min-height:40px;border-radius:10px;cursor:pointer;font-weight:600}
.rowbtn:hover{background:var(--soft);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:32px 8px}.empty b{display:block;color:var(--ink);font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.ringbox{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.ring{position:relative;width:170px;height:170px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:24px;font-weight:800}.mid small{color:var(--mute);font-size:12px}
.st{display:flex;justify-content:space-between;gap:24px;margin-bottom:6px}.st span{color:var(--mute)}
.hint{margin-top:14px;padding:12px;background:var(--soft);border-radius:12px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:170px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--mute)}
.week i{display:block;width:100%;max-width:40px;background:var(--soft);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .5s}
.week .today i{background:var(--acc)}.week .today{color:var(--ink);font-weight:600}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg);margin-bottom:8px}
.lg{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;background:none;cursor:pointer;text-align:left;border-radius:10px;padding:0 6px;font-variant-numeric:tabular-nums}
.lg:hover{background:var(--bg)}.lg i{width:10px;height:10px;border-radius:50%}.lg em{margin-left:auto;font-style:normal;color:var(--mute)}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.feed li:first-child{border-top:0}
.feed span{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.bud{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.bud label{flex:1;color:var(--mute)}.bud input{width:140px;text-align:right}
dialog{border:0;border-radius:20px;padding:22px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog h2{margin:0 0 12px;font-size:18px}
.f{display:grid;gap:12px}.f label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.f .amount{font-size:30px;font-weight:800;text-align:center}
.f .chips{margin:0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.err{color:var(--out);min-height:20px;margin:0;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:9}
.toast[hidden]{display:none}.toast button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer;min-height:32px}
.view{display:none}.view.on{display:block}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px}
 .side nav{grid-auto-flow:column;order:3;width:100%}.side a{justify-content:center}
 .sidebud{display:none}main{padding:16px}.grid2{grid-template-columns:1fr}.actions input{width:100%}.actions{width:100%}.actions .primary{flex:none}
 .hide-s{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Pocket Ledger</div>
    <nav aria-label="Modules">
      <a href="#/expenses" id="n1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Expenses</a>
      <a href="#/insights" id="n2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</a>
    </nav>
    <div class="month" role="group" aria-label="Choose month"><button id="prev" aria-label="Previous month">‹</button><span id="mlabel" aria-live="polite"></span><button id="next" aria-label="Next month">›</button></div>
    <div class="sidebud"><span>Budget used</span><b id="sbtxt"></b><div class="meter"><i id="sbbar" style="width:0"></i></div></div>
  </aside>

  <main>
    <div class="top">
      <h1 id="title">Expenses</h1>
      <div class="actions">
        <input id="q" type="search" placeholder="Search expenses" aria-label="Search expenses">
        <button class="primary" id="open">+ Add expense</button>
      </div>
    </div>

    <section class="view" id="v1" aria-label="Expenses module">
      <div class="kpis">
        <div class="card kpi"><span>Spent this month</span><b id="k1"></b></div>
        <div class="card kpi"><span>Left in budget</span><b id="k2"></b></div>
        <div class="card kpi"><span>Transactions</span><b id="k3"></b></div>
        <div class="card kpi"><span>Biggest category</span><b id="k4"></b></div>
      </div>
      <div class="card">
        <div class="chips" id="filters" role="group" aria-label="Filter by category"></div>
        <div class="tw" id="table"></div>
      </div>
    </section>

    <section class="view" id="v2" aria-label="Insights module">
      <div class="grid2">
        <div class="card">
          <h2>Budget</h2>
          <div class="ringbox">
            <div class="ring">
              <svg viewBox="0 0 120 120" id="ringsvg" role="img" aria-label="Budget used"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bg)" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .7s"/></svg>
              <div class="mid"><b id="left"></b><small id="leftlbl"></small></div>
            </div>
            <div><div class="st"><span>Spent</span><b id="spent"></b></div><div class="st"><span>Budget</span><b id="bud"></b></div><div class="st"><span>Days left</span><b id="days"></b></div></div>
          </div>
          <div class="hint" id="hint"></div>
          <div class="bud"><label for="budget">Monthly budget</label><input id="budget" type="number" inputmode="decimal" min="0"></div>
        </div>
        <div class="card"><h2>Last 7 days <small>hover a bar for the amount</small></h2><div class="week" id="week"></div></div>
        <div class="card"><h2>Where your money went <small>click to filter</small></h2><div id="break"></div></div>
        <div class="card"><h2>Recent activity</h2><ul class="feed" id="feed"></ul></div>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dtitle">
  <form class="f" id="form" novalidate>
    <h2 id="dtitle">Add expense</h2>
    <label>Amount<input class="amount" id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="₹0"></label>
    <div class="chips" id="cats" role="group" aria-label="Category"></div>
    <label>Note<input id="note" type="text" maxlength="60" placeholder="What was it for? (optional)"></label>
    <label>Date<input id="date" type="date"></label>
    <p class="err" id="err" role="alert"></p>
    <div class="btns"><button type="button" class="ghost" id="cancel">Cancel</button><button class="primary" id="save">Save expense</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
var CATS=[["Food","#b42c45"],["Transport","#2563eb"],["Home","#0d7a6f"],["Fun","#9333ea"],["Health","#15803d"],["Shopping","#b45309"],["Other","#64748b"]];
var KEY="pocket-ledger-web-v1",now=new Date();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(n){var d=new Date(now);d.setDate(d.getDate()-Math.min(n,now.getDate()-1));return iso(d)}
function m(n){return "₹"+Math.round(n).toLocaleString()}
function seed(){
  var rows=[[0,"Food",240,"Lunch with team"],[0,"Transport",500,"Metro card top-up"],[0,"Home",350,"Electricity bill"],[1,"Food",180,"Groceries"],[2,"Fun",650,"Movie night"],[2,"Food",320,"Dinner out"],[3,"Transport",210,"Cab"],[4,"Health",480,"Pharmacy"],[5,"Shopping",1200,"Headphone case"],[6,"Food",260,"Breakfast"],[8,"Home",900,"Water and gas"]];
  var s={tx:[],log:[],budget:20000};
  rows.forEach(function(r,i){var d=ago(r[0]);s.tx.push({id:i+1,cat:r[1],amt:r[2],note:r[3],date:d});s.log.push({t:Math.min(Date.now(),new Date(d+"T12:00").getTime()-i*60000),txt:"Spent "+m(r[2])+" on "+r[1]})});
  return s;
}
var S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var view={y:now.getFullYear(),m:now.getMonth()},cat="Food",filter="All",q="",sort={k:"date",d:-1},editId=null,lastDel=null,tt;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function col(n){return (CATS.find(function(c){return c[0]===n})||CATS[6])[1]}
function inView(t){var p=t.date.split("-");return +p[0]===view.y&&+p[1]-1===view.m}
function rel(t){var s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"}
function log(txt){S.log.unshift({t:Date.now(),txt:txt});S.log=S.log.slice(0,30)}
function toast(msg,undo){$("tmsg").textContent=msg;$("undo").style.display=undo?"":"none";$("toast").hidden=false;clearTimeout(tt);tt=setTimeout(function(){$("toast").hidden=true},5000)}

function route(){var r=location.hash==="#/insights"?"insights":"expenses";
  $("v1").classList.toggle("on",r==="expenses");$("v2").classList.toggle("on",r==="insights");
  $("n1").setAttribute("aria-current",r==="expenses"?"page":"false");$("n2").setAttribute("aria-current",r==="insights"?"page":"false");
  $("title").textContent=r==="expenses"?"Expenses":"Insights";$("q").style.display=r==="expenses"?"":"none"}

function render(){
  $("mlabel").textContent=new Date(view.y,view.m,1).toLocaleDateString(undefined,{month:"short",year:"numeric"});
  var mt=S.tx.filter(inView),by={},spent=0;
  mt.forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amt;spent+=t.amt});
  var left=S.budget-spent,pct=S.budget>0?Math.min(spent/S.budget,1):0,keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  var dim=new Date(view.y,view.m+1,0).getDate(),cur=view.y===now.getFullYear()&&view.m===now.getMonth(),dl=cur?Math.max(dim-now.getDate(),1):0;
  $("sbtxt").textContent=m(spent)+" of "+m(S.budget);$("sbbar").style.width=pct*100+"%";
  $("k1").textContent=m(spent);$("k2").textContent=(left<0?"-":"")+m(Math.abs(left));$("k3").textContent=mt.length;$("k4").textContent=keys[0]||"None yet";
  $("left").textContent=(left<0?"-":"")+m(Math.abs(left));$("leftlbl").textContent=left<0?"over budget":"left to spend";
  $("spent").textContent=m(spent);$("bud").textContent=m(S.budget);$("days").textContent=cur?dim-now.getDate():"Closed";$("budget").value=S.budget;
  var a=$("arc");a.setAttribute("stroke-dashoffset",326.7*(1-pct));a.setAttribute("stroke",pct>=1?"var(--out)":pct>=.8?"var(--warn)":"var(--acc)");
  $("ringsvg").setAttribute("aria-label",Math.round(pct*100)+"% of the budget used");
  $("hint").textContent=!cur?"This month is closed. You spent "+m(spent)+".":left>0?"You can spend about "+m(left/dl)+" a day and stay on budget.":"You are "+m(-left)+" over budget. A no-spend day will help.";

  var wk="",mx=1,vals=[];for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var k=iso(d),tot=S.tx.filter(function(t){return t.date===k}).reduce(function(s,t){return s+t.amt},0);vals.push([i,d,tot]);mx=Math.max(mx,tot)}
  vals.forEach(function(v){wk+='<div class="'+(v[0]===0?"today":"")+'" title="'+m(v[2])+'"><span>'+m(v[2])+'</span><i style="height:'+(v[2]/mx*110)+'px" aria-hidden="true"></i><span>'+v[1].toLocaleDateString(undefined,{weekday:"short"})+'</span></div>'});$("week").innerHTML=wk;
  $("break").innerHTML=keys.length?'<div class="bar" role="img" aria-label="Spending by category">'+keys.map(function(k){return'<i style="width:'+by[k]/spent*100+'%;background:'+col(k)+'"></i>'}).join("")+'</div>'+keys.map(function(k){return'<button class="lg" data-f="'+k+'"><i style="background:'+col(k)+'"></i>'+k+'<em>'+m(by[k])+" · "+Math.round(by[k]/spent*100)+'%</em></button>'}).join(""):'<div class="empty"><b>No spending yet</b>Add an expense to see your breakdown.</div>';
  $("feed").innerHTML=S.log.slice(0,7).map(function(l){return"<li>"+esc(l.txt)+"<span>"+rel(l.t)+"</span></li>"}).join("");

  $("filters").innerHTML=["All"].concat(CATS.map(function(c){return c[0]})).map(function(n){return'<button class="chip" data-f="'+n+'" aria-pressed="'+(filter===n)+'">'+n+'</button>'}).join("");
  var rows=mt.filter(function(t){return(filter==="All"||t.cat===filter)&&(t.note+" "+t.cat).toLowerCase().indexOf(q)>-1});
  rows.sort(function(x,y){var c=sort.k==="amt"?x.amt-y.amt:x.date.localeCompare(y.date)||x.id-y.id;return c*sort.d});
  if(!rows.length){$("table").innerHTML='<div class="empty"><b>No expenses found</b>'+(mt.length?"Try a different search or category.":"Use Add expense to record your first one.")+'</div>';return}
  function th(k,l,cls){var on=sort.k===k;return'<th class="'+(cls||"")+'" aria-sort="'+(on?(sort.d>0?"ascending":"descending"):"none")+'"><button data-s="'+k+'">'+l+(on?(sort.d>0?" ↑":" ↓"):"")+'</button></th>'}
  $("table").innerHTML='<table><thead><tr>'+th("date","Date")+'<th>Description</th><th class="hide-s">Category</th>'+th("amt","Amount","r")+'<th><span style="position:absolute;left:-9999px">Actions</span></th></tr></thead><tbody>'+
   rows.map(function(t){return'<tr><td>'+new Date(t.date+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})+'</td><td>'+esc(t.note||t.cat)+'</td><td class="hide-s"><span class="dot" style="background:'+col(t.cat)+'"></span>'+t.cat+'</td><td class="r neg">-'+m(t.amt)+'</td><td class="r" style="white-space:nowrap"><button class="rowbtn" data-e="'+t.id+'" aria-label="Edit '+esc(t.note||t.cat)+'">Edit</button><button class="rowbtn" data-d="'+t.id+'" aria-label="Delete '+esc(t.note||t.cat)+'">Delete</button></td></tr>'}).join("")+'</tbody></table>';
}
function drawCats(){$("cats").innerHTML=CATS.map(function(c){return'<button type="button" class="chip" data-c="'+c[0]+'" aria-pressed="'+(cat===c[0])+'">'+c[0]+'</button>'}).join("")}
function openDlg(id){editId=id||null;var t=id&&S.tx.find(function(x){return x.id===id});
  $("dtitle").textContent=t?"Edit expense":"Add expense";$("save").textContent=t?"Save changes":"Save expense";
  cat=t?t.cat:cat;$("amt").value=t?t.amt:"";$("note").value=t?t.note:"";$("date").value=t?t.date:iso(now);$("err").textContent="";drawCats();$("dlg").showModal();$("amt").focus()}

$("open").onclick=function(){openDlg()};$("cancel").onclick=function(){$("dlg").close()};
$("cats").onclick=function(e){var b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;drawCats()}};
$("form").onsubmit=function(e){e.preventDefault();var a=parseFloat($("amt").value);
  if(!(a>0)){$("err").textContent="Enter an amount greater than 0.";$("amt").focus();return}
  if(!$("date").value){$("err").textContent="Pick a date.";return}
  var d=$("date").value,p=d.split("-"),n=$("note").value.trim();
  if(editId){var t=S.tx.find(function(x){return x.id===editId});t.amt=a;t.cat=cat;t.note=n;t.date=d;log("Edited "+(n||cat)+" to "+m(a))}
  else{S.tx.push({id:Date.now(),cat:cat,amt:a,note:n,date:d});log("Spent "+m(a)+" on "+cat)}
  save();view={y:+p[0],m:+p[1]-1};$("dlg").close();render();toast(editId?"Changes saved":"Expense added",false)};
$("table").onclick=function(e){var s=e.target.closest("[data-s]"),ed=e.target.closest("[data-e]"),de=e.target.closest("[data-d]");
  if(s){var k=s.dataset.s;sort=sort.k===k?{k:k,d:-sort.d}:{k:k,d:-1};render()}
  if(ed)openDlg(+ed.dataset.e);
  if(de){var i=S.tx.findIndex(function(t){return t.id===+de.dataset.d});if(i<0)return;lastDel=S.tx.splice(i,1)[0];log("Deleted "+m(lastDel.amt)+" "+lastDel.cat);save();render();toast("Expense deleted",true)}};
$("undo").onclick=function(){if(lastDel){S.tx.push(lastDel);log("Restored "+m(lastDel.amt)+" "+lastDel.cat);lastDel=null;save();render()}$("toast").hidden=true};
$("filters").onclick=function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render()}};
$("break").onclick=function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;location.hash="#/expenses";render();toast("Showing "+b.dataset.f+" only",false)}};
$("q").oninput=function(){q=this.value.trim().toLowerCase();render()};
$("budget").onchange=function(){var v=parseFloat(this.value);S.budget=v>=0?v:0;log("Budget set to "+m(S.budget));save();render()};
$("prev").onclick=function(){view.m--;if(view.m<0){view.m=11;view.y--}render()};
$("next").onclick=function(){view.m++;if(view.m>11){view.m=0;view.y++}render()};
window.addEventListener("hashchange",route);
route();drawCats();render();
</script>
</body>
</html>
